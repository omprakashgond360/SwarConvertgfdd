name: Build SwarConvert APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/swarconvert/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'SwarConvert'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.swarconvert.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.swarconvert.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1-preview'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="SwarConvert"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/swarconvert/app/MainActivity.java <<'EOF'
          package com.swarconvert.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final int PICK_AUDIO = 100;
              private TextView selectedFile;
              private String selectedName = "Abhi koi audio select nahi hui.";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  if (state != null) {
                      selectedName = state.getString("selectedName", selectedName);
                  }

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(16, 22, 35));
                  scroll.setFitsSystemWindows(true);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(dp(24), dp(36), dp(24), dp(24));
                  scroll.addView(layout);

                  layout.addView(label("SwarConvert", 32, Color.WHITE));
                  layout.addView(label(
                      "ANDROID PREVIEW • 0.1", 13, Color.rgb(101, 211, 195)
                  ));

                  space(layout, 28);

                  layout.addView(label(
                      "Apni audio select karein", 22, Color.WHITE
                  ));
                  layout.addView(label(
                      "Yeh preview file selection test karta hai. "
                      + "Audio conversion abhi available nahi hai.",
                      16, Color.LTGRAY
                  ));

                  space(layout, 20);

                  Button select = new Button(this);
                  select.setText("Audio file choose karein");
                  select.setAllCaps(false);
                  layout.addView(select);

                  selectedFile = label(selectedName, 16, Color.WHITE);
                  layout.addView(selectedFile);

                  space(layout, 24);

                  Button convert = new Button(this);
                  convert.setText("Conversion engine — abhi pending");
                  convert.setAllCaps(false);
                  convert.setEnabled(false);
                  layout.addView(convert);

                  space(layout, 24);

                  layout.addView(label(
                      "Is preview mein audio upload ya convert nahi hoti. "
                      + "App internet ya broad storage permission nahi maangti.",
                      14, Color.LTGRAY
                  ));

                  select.setOnClickListener(view -> {
                      Intent picker = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      picker.addCategory(Intent.CATEGORY_OPENABLE);
                      picker.setType("audio/*");

                      try {
                          startActivityForResult(picker, PICK_AUDIO);
                      } catch (android.content.ActivityNotFoundException error) {
                          selectedFile.setText("Phone par file picker nahi mila.");
                      }
                  });

                  setContentView(scroll);
              }

              private TextView label(String text, int size, int color) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setPadding(0, dp(8), 0, dp(8));
                  return view;
              }

              private void space(LinearLayout parent, int height) {
                  View spacer = new View(this);
                  parent.addView(spacer, new LinearLayout.LayoutParams(1, dp(height)));
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);

                  if (request != PICK_AUDIO || result != RESULT_OK || data == null) {
                      return;
                  }

                  Uri uri = data.getData();
                  if (uri == null) return;

                  selectedName = "Audio file selected";

                  try (Cursor cursor = getContentResolver().query(
                          uri,
                          new String[]{OpenableColumns.DISPLAY_NAME},
                          null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int column = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (column >= 0 && !cursor.isNull(column)) {
                              selectedName = cursor.getString(column);
                          }
                      }
                  } catch (Exception error) {
                      selectedName = "Audio selected; naam read nahi ho saka.";
                  }

                  selectedFile.setText("Selected: " + selectedName);
              }

              @Override
              protected void onSaveInstanceState(Bundle state) {
                  state.putString("selectedName", selectedName);
                  super.onSaveInstanceState(state);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarConvert-Android-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
